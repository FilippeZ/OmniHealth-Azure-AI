version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: omnihealth-fastapi
    ports:
      - "8000:8000"
    environment:
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_CONTENT_SAFETY_ENDPOINT=${AZURE_CONTENT_SAFETY_ENDPOINT}
      - AZURE_SEARCH_ENDPOINT=${AZURE_SEARCH_ENDPOINT}
      - AZURE_COSMOS_ENDPOINT=${AZURE_COSMOS_ENDPOINT}
    restart: always

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: omnihealth-react-ui
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: always
